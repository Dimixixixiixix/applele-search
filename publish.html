<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Article - Applele Search</title>
    <link rel="icon" href="Apple.png">
    <link href="style.css?v=2" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
    <div class="topbar">
      <a class="button" href="https://dimixixixiixix.github.io/applele-search/index.html">&larr; Back to search</a>
    </div>
    <h1 class="title" id="page-title">Write a new article</h1>
    <hr>
    <div class="editor-wrap">
      <input type="text" id="article-title" placeholder="Article title">
      <textarea id="article-markdown" placeholder="Write in markdown...
# Heading
**bold** *italic* [link](https://example.com)"></textarea>
      <button id="publish-btn">Publish</button>
      <p id="publish-status" style="color:#999;font-size:13px;"></p>
    </div>
    <script src="debug-log.js?v=2"></script>
    <script src="articles-ws.js?v=2"></script>
    <script src="google-auth.js?v=2"></script>
    <script>
      var ADMIN_EMAIL = "zandrooortells@gmail.com";
      var currentUser = GoogleAuth.getUser();
      if (!currentUser) {
        alert("Log in with Google first to add an article.");
        window.location.href = "https://dimixixixiixix.github.io/applele-search/#";
      }

      var editSlug = new URLSearchParams(window.location.search).get("slug");
      var titleEl = document.getElementById("article-title");
      var mdEl = document.getElementById("article-markdown");
      var publishBtn = document.getElementById("publish-btn");
      var statusEl = document.getElementById("publish-status");

      if (editSlug) {
        document.getElementById("page-title").textContent = "Edit article";
        publishBtn.textContent = "Save changes";
        ArticlesWS.get(editSlug).then(function (article) {
          if (!article) {
            statusEl.textContent = "Article not found (still syncing? try refreshing).";
            return;
          }
          if (article.authorId !== currentUser.id && currentUser.email !== ADMIN_EMAIL) {
            alert("You can only edit your own articles.");
            window.location.href =
              "https://dimixixixiixix.github.io/applele-search/#/articles/" + encodeURIComponent(editSlug);
            return;
          }
          titleEl.value = article.title;
          mdEl.value = article.markdown;
        });
      }

      function handlePublishClick() {
        try {
          var titleVal = titleEl.value.trim();
          var markdownVal = mdEl.value.trim();
          if (!titleVal || !markdownVal) {
            statusEl.textContent = "Add a title and some content first.";
            return;
          }
          publishBtn.disabled = true;
          statusEl.textContent = editSlug ? "Saving..." : "Publishing...";

          var action = editSlug
            ? ArticlesWS.edit({
                slug: editSlug,
                title: titleVal,
                markdown: markdownVal,
                idToken: currentUser.idToken,
              })
            : ArticlesWS.save({
                title: titleVal,
                markdown: markdownVal,
                idToken: currentUser.idToken,
              });

          action
            .then(function (article) {
              publishBtn.disabled = false;
              if (!article || !article.slug) {
                console.error("Publish/edit resolved without a valid article:", article);
                statusEl.textContent =
                  "Server accepted the request but didn't return a valid article - open the console (F12) for details.";
                return;
              }
              statusEl.textContent = "Saved! Redirecting...";
              setTimeout(function () {
                window.location.href =
                  "https://dimixixixiixix.github.io/applele-search/#/articles/" + encodeURIComponent(article.slug);
              }, 1000);
            })
            .catch(function (err) {
              publishBtn.disabled = false;
              statusEl.textContent = "Error: " + (err && err.message ? err.message : String(err));
            });
        } catch (err) {
          console.error("Publish failed synchronously:", err);
          alert("Sync error:\n" + (err && err.stack ? err.stack : String(err)));
          publishBtn.disabled = false;
        }
      }
      publishBtn.addEventListener("click", handlePublishClick);
    </script>
  </body>
</html>
